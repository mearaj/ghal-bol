[package]
name = "ghal_bol_ddns"
version = "0.1.0"
edition = "2024"
description = "GoDaddy dynamic DNS for Ghal Bol home servers"
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

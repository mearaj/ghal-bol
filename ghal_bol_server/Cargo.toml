[package]
name = "ghal_bol_server"
version = "0.1.0"
edition = "2024"
description = "Ghal Bol coordination server (presence, endpoint discovery)"
publish = false

[[bin]]
name = "ghal_bol_server"
path = "src/main.rs"

[[bin]]
name = "coord_client"
path = "src/bin/coord_client.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
hex = "0.4"
rand = "0.10"
secp256k1 = { version = "0.31", features = ["rand", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
directories = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Circuit Relay v2 node (NAT traversal) — kept protocol-compatible with the ghal_bol client (libp2p 0.56).
futures = "0.3"
libp2p = { version = "0.56", features = [
    "tokio",
    "macros",
    "tcp",
    "noise",
    "yamux",
    "relay",
    "identify",
    "ping",
    "dns",
    # The ghal_bol client authenticates with its secp256k1 device identity (golden rule 7).
    # Without this feature the relay's noise handshake cannot decode/verify a secp256k1 peer's
    # public key and drops the connection mid-handshake (client sees Decode(UnexpectedEof)),
    # so no secp256k1 client can ever reserve a circuit. ed25519 is on by default.
    "secp256k1",
    "ed25519",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }

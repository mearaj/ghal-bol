[package]
name = "ghal_bol_server"
version = "0.1.0"
edition = "2024"
description = "Ghal Bol coordination server (presence, endpoint discovery)"
publish = false

[[bin]]
name = "ghal_bol_server"
path = "src/main.rs"

[[bin]]
name = "coord_client"
path = "src/bin/coord_client.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
hex = "0.4"
rand = "0.10"
secp256k1 = { version = "0.31", features = ["rand", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
directories = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }

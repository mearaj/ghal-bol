[package]
name = "ghal_bol_server"
version = "0.1.0"
edition = "2024"
description = "Ghal Bol coordination server (presence, endpoint discovery)"
publish = false

[[bin]]
name = "ghal_bol_server"
path = "src/main.rs"

[[bin]]
name = "coord_client"
path = "src/bin/coord_client.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
hex = "0.4"
rand = "0.10"
secp256k1 = { version = "0.31", features = ["rand", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
directories = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
socket2 = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Circuit Relay v2 node (NAT traversal) — kept protocol-compatible with the ghal_bol client (libp2p 0.56).
futures = "0.3"
libp2p = { version = "0.56", features = [
    "tokio",
    "macros",
    "tcp",
    "noise",
    "yamux",
    "relay",
    "identify",
    "ping",
    "dns",
    # Clients may use secp256k1, ed25519, or ecdsa-p256 device identities for Noise.
    "secp256k1",
    "ed25519",
    "ecdsa",
] }
igd-next = { version = "0.17.1", features = ["aio_tokio"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }

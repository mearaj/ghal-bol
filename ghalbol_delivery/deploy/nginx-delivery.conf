# delivery.ghalbol.com — Let's Encrypt. WAN HTTPS/WSS on :55003 (router forward); :443 optional.
# Home high port (like coord1 relay 55002) — many routers forward 8443/55002 but not 8444.
# types_hash_* already set in ghalbol-coord1.conf when both services share this host.

limit_req_zone $binary_remote_addr zone=delivery_http:10m rate=30r/s;

server {
    listen 55003 ssl;
    listen [::]:55003 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name delivery.ghalbol.com;

    ssl_certificate     /etc/letsencrypt/live/delivery.ghalbol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delivery.ghalbol.com/privkey.pem;

    client_max_body_size 2m;

    access_log /var/log/nginx/delivery.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/delivery.error.log warn;

    location / {
        limit_req zone=delivery_http burst=60 nodelay;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name delivery.ghalbol.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:55003$request_uri;
    }
}

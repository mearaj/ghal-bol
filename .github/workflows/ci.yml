name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # AGENTS.md: no warning suppressions — workspace crates must build warning-free.
  # (Cargo caps lints for registry/git dependencies, so this only affects our crates.)
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    env:
      GHALBOL_COORD_URLS: ""
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Reject libp2p in core/coord lockfile
        run: |
          if rg '^name = "libp2p' Cargo.lock; then
            echo "libp2p must not appear in Cargo.lock for ghalbol_core / ghalbol_coord"
            exit 1
          fi

      - name: Install native deps (cpal/ALSA + libopus for voice, desktop UI libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libpulse-dev clang

      - name: Unit tests (ghalbol_core)
        run: cargo test -p ghalbol_core --lib

      - name: Unit tests (ghalbol_coord)
        run: cargo test -p ghalbol_coord

      - name: Unit tests (ghalbol_delivery)
        run: cargo test -p ghalbol_delivery

      - name: Unit tests (ghalbol_ddns)
        run: cargo test -p ghalbol_ddns

      - name: App tests (languages, bubbles, navigation history)
        run: cargo test -p ghalbol_app

      - name: Check whole workspace (all targets)
        run: cargo check --workspace --all-targets

  windows:
    name: Windows cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm cmake

      - name: Check desktop app for Windows
        run: cargo check -p ghalbol_app --target x86_64-pc-windows-gnu

  android:
    name: Android check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install build tools (static Opus for Android)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Check app + core the way cargo-makepad builds them
        # Runner images preinstall the NDK; ANDROID_NDK_LATEST_HOME is set by the image.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/check_android.sh

  scripts:
    name: Packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bash syntax
        run: |
          for f in scripts/*.sh scripts/linux/*.sh apps/ghalbol/scripts/*.sh; do
            bash -n "$f"
          done

      - name: PowerShell syntax (Windows installer)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Error "$($file.Name): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

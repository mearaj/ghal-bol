name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    env:
      GHAL_BOL_COORD_URLS: ""
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Reject libp2p in core/coord lockfile
        run: |
          if rg '^name = "libp2p' Cargo.lock; then
            echo "libp2p must not appear in Cargo.lock for ghal_bol_core / ghal_bol_coord"
            exit 1
          fi

      - name: Install native deps (cpal/ALSA + libopus for voice)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config

      - name: Unit tests (ghal_bol_core)
        run: cargo test -p ghal_bol_core --lib

      - name: Unit tests (ghal_bol_coord)
        run: cargo test -p ghal_bol_coord

      - name: Unit tests (ghal_bol_delivery)
        run: cargo test -p ghal_bol_delivery

      - name: Install desktop UI libraries
        run: sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev clang

      - name: Check desktop app
        run: cargo check -p ghal_bol_app

      - name: App language tests
        run: cargo test -p ghal_bol_app --bin ghal_bol_app -- i18n::

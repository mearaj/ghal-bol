name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    env:
      GHAL_BOL_COORD_URLS: ""
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Reject libp2p in core/coord lockfile
        run: |
          if rg '^name = "libp2p' Cargo.lock; then
            echo "libp2p must not appear in Cargo.lock for ghal_bol_core / ghal_bol_coord"
            exit 1
          fi

      - name: Install native deps (cpal/ALSA + libopus for voice)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config

      - name: Unit tests (ghal_bol_core)
        run: cargo test -p ghal_bol_core --lib

      - name: Unit tests (ghal_bol_coord)
        run: cargo test -p ghal_bol_coord

      - name: Unit tests (ghal_bol_delivery)
        run: cargo test -p ghal_bol_delivery

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghal_bol_ui
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Ephemeral env files for asset check
        run: |
          cp env/.env.development.example env/.env.development
          cp env/.env.production.example env/.env.production

      - name: Daemon SDK parity (Rust + Dart)
        working-directory: .
        run: ./scripts/check_daemon_sdk_parity.sh

      - name: dart analyze
        run: dart analyze --fatal-warnings

      - name: flutter test
        run: flutter test

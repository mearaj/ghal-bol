# GhalBol common workspace — the ONLY shared thing between apps.
# Each product under `apps/<app>/` owns all of its code.
# Infrastructure crates (coord, delivery) are shared where they serve common needs.
[workspace]
members = [
    "ghalbol_core",
    "ghalbol_coord",
    "ghalbol_delivery",
    "ghalbol_ddns",
    "apps/ghalbol",
    "tools/ghalbol-dev",
    "tools/ghalbol-android-dev",
    "tools/ghalbol-windows-dev",
]
exclude = [
    "vendor/makepad",
]
resolver = "2"

# Faster iterative builds (deps compile at opt-level 2 in dev) — same idea as emilk/eframe_template.
[profile.dev.package."*"]
opt-level = 2

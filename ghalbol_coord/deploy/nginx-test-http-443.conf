# TEMPORARY TEST — plain HTTP on port 443 (no TLS).
# If http://ghalbol-coord1.ddns.net:443/health works from WAN, port 443 forwards and the issue is HTTPS/TLS.
# If it still times out, inbound 443 never reaches this PC.
#
# Install: copy conf, then run nginx -t, then systemctl reload nginx (three separate commands).
# Revert: copy nginx-coord1-selfsigned.conf or nginx-coord1.conf the same way.

server {
    listen 443;
    server_name coord1.ghalbol.com;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name coord1.ghalbol.com;

    location / {
        return 200 'http-80-ok\n';
        add_header Content-Type text/plain;
    }
}

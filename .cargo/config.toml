# Android cross-compilation for raw `cargo --target …-linux-android` (sanity checks, CI).
#
# Use **`source scripts/android-ndk-env.sh`** (auto-finds Studio’s `~/Android/Sdk/ndk/*` when
# `ANDROID_NDK_HOME` is unset) or **`scripts/with-android-env.sh cargo check …`**. Cargo expands
# `${ANDROID_NDK_TOOLCHAIN_BIN}` for `linker` / `ar` only; C/C++ build scripts still need `CC_*` /
# `CXX_*`, which those helpers set (see `.cargo/` cannot reliably use `[env]` with `${VAR}` expansion).
#
# APK / Gradle flow: **`cargo ndk`** (see **`PORTABILITY.md`**) resolves the NDK itself.

[target.aarch64-linux-android]
linker = "${ANDROID_NDK_TOOLCHAIN_BIN}/aarch64-linux-android21-clang"
ar = "${ANDROID_NDK_TOOLCHAIN_BIN}/llvm-ar"

[target.armv7-linux-androideabi]
linker = "${ANDROID_NDK_TOOLCHAIN_BIN}/armv7a-linux-androideabi21-clang"
ar = "${ANDROID_NDK_TOOLCHAIN_BIN}/llvm-ar"

[target.i686-linux-android]
linker = "${ANDROID_NDK_TOOLCHAIN_BIN}/i686-linux-android21-clang"
ar = "${ANDROID_NDK_TOOLCHAIN_BIN}/llvm-ar"

[target.x86_64-linux-android]
linker = "${ANDROID_NDK_TOOLCHAIN_BIN}/x86_64-linux-android21-clang"
ar = "${ANDROID_NDK_TOOLCHAIN_BIN}/llvm-ar"

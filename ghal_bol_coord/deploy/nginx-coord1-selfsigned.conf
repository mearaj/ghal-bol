# Self-signed fallback — same ports as nginx-coord1.conf (8443 WAN + 443 local).

types_hash_max_size 2048;
types_hash_bucket_size 128;

limit_req_zone $binary_remote_addr zone=coord1_http:10m rate=20r/s;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coord1.ghalbol.com;

    ssl_certificate     /etc/nginx/ssl/coord1.ghalbol.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/coord1.ghalbol.com/privkey.pem;

    client_max_body_size 64k;

    access_log /var/log/nginx/coord1.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/coord1.error.log warn;

    location / {
        limit_req zone=coord1_http burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name coord1.ghalbol.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

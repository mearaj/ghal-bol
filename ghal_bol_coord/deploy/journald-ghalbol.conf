# Cap systemd journal size on the coord VM (avoids unbounded disk growth from ghal-bol-coord logs).
# Install: sudo cp journald-ghalbol.conf /etc/systemd/journald.conf.d/ghalbol.conf
#          sudo systemctl restart systemd-journald

[Journal]
SystemMaxUse=100M
SystemKeepFree=500M
RuntimeMaxUse=50M
MaxRetentionSec=14day

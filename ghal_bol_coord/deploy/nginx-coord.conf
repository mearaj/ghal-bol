# Optional nginx example — copy and edit certificate paths on your machine.
# ghal_bol_coord listens on 127.0.0.1:8765 only; nginx terminates TLS on :443.
#
# Replace SSL certificate paths with wherever certbot (or your CA) puts files.
# Logs go to coord.* files — rotated by deploy/nginx-logrotate-ghalbol (deploy_server.sh).

limit_req_zone $binary_remote_addr zone=coord_http:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name coord.ghalbol.com;

    ssl_certificate     REPLACE_ME/fullchain.pem;
    ssl_certificate_key REPLACE_ME/privkey.pem;

    client_max_body_size 64k;

    access_log /var/log/nginx/coord.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/coord.error.log warn;

    location / {
        limit_req zone=coord_http burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name coord.ghalbol.com;
    return 301 https://$host$request_uri;
}

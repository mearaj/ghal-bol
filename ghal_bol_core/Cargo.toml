[package]
name = "ghal_bol_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "ghal_bol_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ghal_bol_core_daemon"
path = "src/bin/ghal_bol_core_daemon.rs"
required-features = []

[dependencies]
base64 = "0.22"
bytes = "1"
flume = "0.12"
mdns-sd = "0.20"
snow = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
directories = "6"
aes-gcm = "0.10"
bs58 = "0.5"
hex = "0.4"
hkdf = "0.13"
secp256k1 = { version = "0.31", features = ["rand", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
webpki-roots = "0.26"
tokio-rustls = "0.26"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "io-util",
    "io-std",
    "net",
] }
if-addrs = "0.14"
fs4 = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
audiopus = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15"
openh264 = "0.9"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

[features]
default = []
test-minimal-swarm = []

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = { version = "0.7", features = ["jni"] }
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
ndk-context = "0.1"
openh264 = "0.9"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ghal_bol_coord = { path = "../ghal_bol_coord" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
